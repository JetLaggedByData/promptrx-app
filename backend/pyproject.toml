[project]
name = "promptrx-backend"
version = "1.0.0"
description = "PromptRx API"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "anthropic==0.40.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "python-multipart==0.0.12",
    "redis==5.1.1",
    "slowapi==0.1.9",
    "structlog==24.4.0",
    "sentry-sdk[fastapi]==2.17.0",
    "httpx==0.27.2",
    "email-validator==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "anyio==4.6.0",
    "black==24.10.0",
    "isort==5.13.2",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# greenlet tracing is required so that coverage follows execution into the
# greenlets that SQLAlchemy's asyncio bridge spawns — without it, any route
# body that awaits a DB call appears uncovered even when the test calls it.
concurrency = ["greenlet"]
source = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
